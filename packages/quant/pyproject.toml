[project]
name = "quant"
version = "0.1.0"
description = "Quant Research Layer: signal generation, forecast scaling, position sizing"
requires-python = ">=3.13"
dependencies = [
    "ingest",
    "duckdb>=1.1",
]

[tool.uv.sources]
ingest = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/quant"]
