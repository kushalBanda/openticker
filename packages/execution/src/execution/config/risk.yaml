# Which risk checks run in front of PaperBroker (and later LiveBroker),
# in this order, with what thresholds. Loaded via RiskPipeline.from_config.
checks:
  - name: max_position_size
    params:
      max_shares_per_symbol: 1000
  - name: max_order_notional
    params:
      max_notional: 500000.0
  - name: max_daily_loss
    params:
      max_daily_loss_pct: 0.05
      starting_equity: 100000.0
  - name: order_rate_limiter
    params:
      max_orders_per_second: 10
  - name: price_collar
    params:
      max_deviation_pct: 0.05
  - name: duplicate_order
    params: {}
