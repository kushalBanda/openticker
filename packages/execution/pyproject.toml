[project]
name = "execution"
version = "0.1.0"
description = "Pre-trade risk pipeline and broker implementations (paper trading), promoted from BacktestBroker"
requires-python = ">=3.13"
dependencies = [
    "ingest",
    "strategy",
]

[tool.uv.sources]
ingest = { workspace = true }
strategy = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/execution"]
