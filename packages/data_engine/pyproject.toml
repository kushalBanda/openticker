[project]
name = "data-engine"
version = "0.1.0"
description = "Ingests historical and live market data via pluggable provider adapters, DuckDB storage"
requires-python = ">=3.13"
dependencies = [
    "duckdb>=1.1",
    "pyotp>=2.9",
    "pytz>=2024.2",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/data_engine"]
