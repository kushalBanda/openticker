[project]
name = "agents"
version = "0.1.0"
description = "AI-native components: LLM client wrapper (litellm) and per-strategy AI advisors that tune strategy params"
requires-python = ">=3.13"
dependencies = [
    "quant",
    "litellm>=1.52",
]

[tool.uv.sources]
quant = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agents"]
