# Which strategy runs against which symbol, with what parameters.
# Adding a new run means adding one entry here, no engine code changes.
runs:
  - name: sma_crossover
    symbol: NSE-RELIANCE
    interval: 1d
    starting_cash: 100000.0
    params:
      short_window: 5
      long_window: 20
      quantity: 10
  - name: rsi_mean_reversion
    symbol: NSE-RELIANCE
    interval: 1d
    starting_cash: 100000.0
    params:
      period: 14
      oversold: 30.0
      overbought: 70.0
      quantity: 5
  - name: rsi_mean_reversion_sized
    symbol: NSE-RELIANCE
    interval: 1d
    starting_cash: 100000.0
    params:
      period: 14
      oversold: 30.0
      overbought: 70.0
      target_risk_pct: 0.02
