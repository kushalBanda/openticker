[project]
name = "strategy"
version = "0.1.0"
description = "Bar-by-bar strategy backtest engine, pluggable strategies via registry"
requires-python = ">=3.13"
dependencies = [
    "ingest",
]

[tool.uv.sources]
ingest = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/strategy"]
