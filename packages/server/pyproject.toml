[project]
name = "server"
version = "0.1.0"
description = "Unified REST API over ingest, quant, strategy, and execution"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "duckdb>=1.1",
    "python-dotenv>=1.0",
    "ingest",
    "quant",
    "strategy",
    "execution",
]

[tool.uv.sources]
ingest = { workspace = true }
quant = { workspace = true }
strategy = { workspace = true }
execution = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/server"]
