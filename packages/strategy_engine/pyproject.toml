[project]
name = "strategy-engine"
version = "0.1.0"
description = "Bar-by-bar strategy backtest engine, pluggable strategies via registry"
requires-python = ">=3.13"
dependencies = [
    "data-engine",
]

[tool.uv.sources]
data-engine = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/strategy_engine"]
