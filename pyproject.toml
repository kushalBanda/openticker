[project]
name = "openticker"
version = "0.1.0"
description = "Self-hosted trading platform for Indian markets, operated by AI agents over MCP"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Kushal Banda" }]
requires-python = ">=3.13"
keywords = ["mcp", "trading", "ai-agents", "zerodha", "kite-connect", "nse", "algorithmic-trading"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial :: Investment",
    "Typing :: Typed",
]
dependencies = [
    "mcp>=2.2.0",
    "httpx>=0.28",
    "sqlalchemy>=2.0",
    "cryptography>=43",
    "python-dotenv>=1.0",
    "duckdb>=1.5.5",
    "pydantic>=2.13.5",
]

[project.urls]
Homepage = "https://github.com/kushalBanda/openticker"
Issues = "https://github.com/kushalBanda/openticker/issues"
Changelog = "https://github.com/kushalBanda/openticker/blob/main/CHANGELOG.md"

[project.scripts]
openticker-mcp = "openticker.adapters.inbound.mcp_server:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
exclude = [".codegraph", ".github", ".pre-commit-config.yaml", "CLAUDE.local.md"]

[tool.hatch.build.targets.wheel]
packages = ["src/openticker"]

[dependency-groups]
dev = [
    "mypy>=1.14",
    "pytest>=8.3",
    "ruff>=0.16",
]

[tool.mypy]
python_version = "3.13"
strict = true
mypy_path = "src"
explicit_package_bases = true

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
