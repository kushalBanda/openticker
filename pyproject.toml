[project]
name = "quant-platform"
version = "0.2.0"
description = "Quant trading platform: flat mechanics + math scripts behind a Claude Code skill layer, OpenClaw-style - no packages, no registries, no MCP server"
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.27",
    "duckdb>=1.1",
    "pandas>=2.2",
    "numpy>=2.0",
    "scipy>=1.14",
    "python-dotenv>=1.0",
    "ta>=0.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
bypass-selection = true

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "mypy>=1.13",
    "black>=24.10",
    "ruff>=0.7",
    "respx>=0.21",
    "scipy-stubs>=1.14",
    "pandas-stubs>=2.3",
]

[tool.mypy]
python_version = "3.13"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
mypy_path = "plugin"
explicit_package_bases = true

[[tool.mypy.overrides]]
module = "ta.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["plugin"]
addopts = "--import-mode=importlib"
