[project]
name = "quant-platform"
version = "0.1.0"
description = "Quant trading platform: DataEngine, Strategy/Backtest Engine, Quant Research Layer, Execution Engine"
requires-python = ">=3.13"
dependencies = [
    "data-engine",
]

[tool.uv.sources]
data-engine = { workspace = true }

[tool.uv.workspace]
members = ["packages/*"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
bypass-selection = true

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "mypy>=1.13",
    "black>=24.10",
    "ruff>=0.7",
    "respx>=0.21",
    "types-pyyaml>=6.0",
    "python-dotenv>=1.0",
]

[tool.ruff.lint.per-file-ignores]
# These tests deliberately construct naive datetimes to reproduce Kite's
# real WebSocket tick shape (exchange_timestamp/last_trade_time come back
# with no tzinfo), not a bug, DTZ001 doesn't apply here.
"packages/data_engine/tests/adapters/test_kite_mapper.py" = ["DTZ001"]
"packages/data_engine/tests/adapters/test_kite_adapter.py" = ["DTZ001"]
# Deliberate defensive catch-all inside a background-thread SDK callback
# (Groww's NATS feed client). Anything raised here would otherwise vanish
# silently in that thread instead of surfacing through DataEngine's queue,
# so a blind except converting to a typed error is the correct boundary.
"packages/data_engine/src/data_engine/adapters/groww/adapter.py" = ["BLE001"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
mypy_path = "packages/data_engine/src"

[[tool.mypy.overrides]]
module = ["growwapi", "growwapi.*", "kiteconnect", "kiteconnect.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
