[project]
name = "quant-platform"
version = "0.2.0"
description = "Quant trading platform: flat Kite Connect mechanics, no packages, no registries, no MCP server"
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.27",
    "duckdb>=1.1",
    "pytz>=2024.1",
    "python-dotenv>=1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
bypass-selection = true

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "mypy>=1.13",
    "black>=24.10",
    "ruff>=0.7",
    "respx>=0.21",
]

[tool.mypy]
python_version = "3.13"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
explicit_package_bases = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["lib", "scripts"]
addopts = "--import-mode=importlib"
