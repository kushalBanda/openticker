<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Backtest Dashboard</title>
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; margin: 0; padding: 16px; background: #0d1117; color: #c9d1d9; }
  h1 { font-size: 18px; font-weight: 500; margin: 0 0 16px; }
  h2 { font-size: 14px; font-weight: 500; margin: 0 0 8px; color: #8b949e; }
  .panel { margin-bottom: 24px; }
  .chart { width: 100%; height: 300px; }
  .empty { color: #6e7681; font-size: 13px; padding: 12px 0; }
  table { border-collapse: collapse; width: 100%; font-size: 13px; }
  th, td { border: 1px solid #30363d; padding: 6px 10px; text-align: right; }
  th { background: #161b22; }
  td:first-child, th:first-child { text-align: left; }
  td.side-buy { color: #3fb950; }
  td.side-sell { color: #f85149; }
</style>
</head>
<body>
<h1 id="title"></h1>
<div id="candlestick-panels"></div>
<div class="panel">
  <h2>Equity Curve</h2>
  <div id="equity-chart" class="chart"></div>
</div>
<div class="panel">
  <h2>Ledger</h2>
  <table id="ledger-table">
    <thead>
      <tr><th>Time</th><th>Symbol</th><th>Side</th><th>Qty</th><th>Fill Price</th><th>Commission</th><th>Realized P&amp;L</th><th>Cash After</th></tr>
    </thead>
    <tbody></tbody>
  </table>
</div>
<script src="/lightweight-charts.js"></script>
<script>
(function () {
  const run = window.__RUN__;

  document.getElementById("title").textContent =
    run.strategy + " — " + run.symbols.join(", ") + " (" + run.run_id + ")";

  function toUnixSeconds(iso) {
    return Math.floor(new Date(iso).getTime() / 1000);
  }

  const chartOptions = {
    layout: { background: { color: "#0d1117" }, textColor: "#c9d1d9" },
    grid: { vertLines: { color: "#21262d" }, horzLines: { color: "#21262d" } },
    timeScale: { timeVisible: true },
  };

  const panelsRoot = document.getElementById("candlestick-panels");
  for (const symbol of run.symbols) {
    const bars = run.bars[symbol] || [];
    const section = document.createElement("div");
    section.className = "panel";
    const heading = document.createElement("h2");
    heading.textContent = symbol;
    const chartDiv = document.createElement("div");
    chartDiv.className = "chart";
    section.appendChild(heading);
    section.appendChild(chartDiv);
    panelsRoot.appendChild(section);

    if (bars.length === 0) {
      chartDiv.className = "empty";
      chartDiv.textContent = "No cached bars for " + symbol + ".";
      continue;
    }

    const chart = LightweightCharts.createChart(chartDiv, Object.assign(
      { width: chartDiv.clientWidth, height: 300 }, chartOptions
    ));
    const candleSeries = chart.addCandlestickSeries();
    candleSeries.setData(bars.map(function (b) {
      return { time: toUnixSeconds(b.ts), open: b.open, high: b.high, low: b.low, close: b.close };
    }));

    const markers = run.ledger
      .filter(function (entry) { return entry.symbol === symbol; })
      .map(function (entry) {
        return {
          time: toUnixSeconds(entry.ts),
          position: entry.side === "buy" ? "belowBar" : "aboveBar",
          color: entry.side === "buy" ? "#3fb950" : "#f85149",
          shape: entry.side === "buy" ? "arrowUp" : "arrowDown",
          text: entry.side + " " + entry.quantity,
        };
      })
      .sort(function (a, b) { return a.time - b.time; });
    candleSeries.setMarkers(markers);
  }

  const equityDiv = document.getElementById("equity-chart");
  const equityChart = LightweightCharts.createChart(equityDiv, Object.assign(
    { width: equityDiv.clientWidth, height: 300 }, chartOptions
  ));
  const equitySeries = equityChart.addLineSeries({ color: "#58a6ff" });
  equitySeries.setData(run.equity_curve.map(function (p) {
    return { time: toUnixSeconds(p.ts), value: p.equity };
  }));

  const tbody = document.querySelector("#ledger-table tbody");
  for (const entry of run.ledger) {
    const row = document.createElement("tr");
    row.innerHTML =
      "<td>" + entry.ts + "</td>" +
      "<td>" + entry.symbol + "</td>" +
      "<td class=\"side-" + entry.side + "\">" + entry.side + "</td>" +
      "<td>" + entry.quantity + "</td>" +
      "<td>" + entry.fill_price.toFixed(2) + "</td>" +
      "<td>" + entry.commission.toFixed(2) + "</td>" +
      "<td>" + entry.realized_pnl.toFixed(2) + "</td>" +
      "<td>" + entry.cash_after.toFixed(2) + "</td>";
    tbody.appendChild(row);
  }
})();
</script>
</body>
</html>
