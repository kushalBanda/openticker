name: Feature request
description: A new tool, capability, or improvement.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the workflow, ideally as something you'd ask an agent to do.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would help
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you've considered
