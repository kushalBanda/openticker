name: Bug report
description: Something doesn't work as documented.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Never paste API keys, session tokens, or request tokens here.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: Include the tool you called, its arguments, and the full response or error.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
  - type: input
    id: broker
    attributes:
      label: Broker
      placeholder: zerodha
  - type: input
    id: client
    attributes:
      label: MCP client and version
      placeholder: Claude Code 2.x, Codex, ...
  - type: input
    id: version
    attributes:
      label: OpenTicker commit or version
