name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to the same branch cancels the run still going.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: Lint
        run: uv run ruff check src tests
      - name: Type check
        run: uv run mypy src tests
      - name: Test
        run: uv run pytest

  ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: ui/package.json
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      - run: uv sync --locked
        working-directory: .
      - run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm check
      - name: Type check
        run: pnpm typecheck
      - name: Unit tests
        run: pnpm test
      - name: API types match the server
        run: pnpm gen:api && git diff --exit-code src/api/schema.d.ts
      - name: Build
        run: pnpm build
