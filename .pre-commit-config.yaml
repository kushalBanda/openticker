repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.0
    hooks:
      - id: gitleaks
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.8
    hooks:
      - id: ruff-check
  - repo: local
    hooks:
      - id: mypy
        name: mypy (strict)
        entry: uv run mypy src tests
        language: system
        types: [python]
        pass_filenames: false
