<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>OpenTicker</title>
    <script>
      // The theme before first paint: the one chosen on this machine, else the system's.
      (() => {
        let chosen = null;
        try {
          chosen = localStorage.getItem("ot-theme");
        } catch {}
        const dark = matchMedia("(prefers-color-scheme: dark)").matches;
        document.documentElement.dataset.theme =
          chosen === "light" || chosen === "dark" ? chosen : dark ? "dark" : "light";
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
